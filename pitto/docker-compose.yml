# ローカル開発用の PostgreSQL。
#
#   docker compose up -d
#
# .env.example の DATABASE_URL はこの設定に合わせてある。
# Supabase を使う場合はこのファイルを使わず、DATABASE_URL を差し替えるだけでよい。

services:
  db:
    image: postgres:16-alpine
    container_name: pitto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pitto
      # 日本語を含むデータを入れるため UTF-8 で初期化する。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - pitto-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pitto"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pitto-db-data:
